version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
    container_name: rag_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_platform
      # Shared secrets for the automatic-intake webhooks. The pretend
      # senders (mock-sources) use the same values. Demo defaults;
      # override via a root-level .env file or your shell.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-demo-github-secret-change-me}
      ZOOM_WEBHOOK_SECRET: ${ZOOM_WEBHOOK_SECRET:-demo-zoom-secret-change-me}
      ZOOM_DOWNLOAD_HOSTS: zoom.us,mock-sources
      # Live GitHub demo: which GitHub account counts as which team member,
      # and which repository may send evidence. Add more with commas.
      GITHUB_LOGIN_MAP: ${GITHUB_LOGIN_MAP:-harshini0825=morgan}
      GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS:-harshini0825/morgan-percept-ai-demo}
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface

    depends_on:
      - postgres

  # Pretend Zoom + GitHub for the automatic-intake demo (see
  # docs/automatic_intake_demo.md). Control page: http://localhost:9000
  mock-sources:
    profiles: ["simulator"]   # off by default; start with: docker-compose --profile simulator up -d mock-sources
    build:
      context: ./mock-sources
    container_name: rag_mock_sources
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_URL: http://mock-sources:9000
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-demo-github-secret-change-me}
      ZOOM_WEBHOOK_SECRET: ${ZOOM_WEBHOOK_SECRET:-demo-zoom-secret-change-me}
    ports:
      - "9000:9000"
    volumes:
      - ./backend/demo_inputs/meeting_action_items:/demo_inputs:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  hf_cache: